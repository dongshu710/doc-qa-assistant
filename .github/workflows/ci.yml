name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke · py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    env:
      PYTHONUTF8: "1"

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 语法检查
        run: python -m compileall -q src tests tools

      # 前端资源是 .js/.css/.html 文件，语法错不该等到浏览器里白屏才发现
      - name: 前端资源（node --check / CSS 括号 / 内联脚本）
        run: python tools/check_frontend.py

      - name: 前端装配与资源护栏
        run: python tests/test_frontend.py

      - name: 可选向量依赖（NumPy + FAISS）
        run: python -m pip install "numpy==2.3.3" "faiss-cpu==1.12.0"

      - name: 关键词抽取 / 命中 / 零调用
        run: python tests/test_keywords.py

      - name: 关键词 HTTP 接口
        run: python tests/test_keyword_api.py

      - name: 关键词精度回归（否定 / 极性 / 意图 / 单文档）
        run: python tests/test_keyword_precision.py

      - name: 关键词评测（应直出 / 不应直出）
        run: python tests/eval_keyword.py

      # 质量门禁：对抗用例必须全过、总通过率 ≥90%，否则脚本非零退出。
      # 不配 Key 也能跑（离线抽取），所以能作为每次提交的硬门禁；
      # 有 Key 的真实模型评测另在发布前手工跑，避免 CI 烧钱。
      - name: 问答质量门禁（离线抽取）
        run: python tests/eval_run.py --out report.json

      - name: 多轮会话上下文
        run: python tests/test_session.py

      - name: 流式问答 SSE
        run: python tests/test_stream.py

      - name: 生成层流式解析与截断降级
        run: python tests/test_generator_stream.py

      - name: 表格入库（xlsx / csv / tsv）
        run: python tests/test_table_ingest.py

      - name: 日志轮转与尾读
        run: python tests/test_jsonl_log.py

      - name: HTTP 传输（保活 / gzip / 304 / HEAD）
        run: python tests/test_http_transport.py

      - name: 后台重建与增量解析
        run: python tests/test_async_reload.py

      - name: 汇报页缓存
        run: python tests/test_report_cache.py

      - name: 笔记存储（原子写 / 自愈 / 重建 / 去重 / CLI）
        run: python tests/test_notes_store.py

      - name: 规则摘要（20 条样本 + 非法输入）
        run: python tests/test_notes_digest_rule.py

      - name: 笔记 HTTP（CRUD / 乐观锁 / 删除确认 / 鉴权）
        run: python tests/test_notes_api.py

      - name: 笔记 MCP（握手 / 7 工具 / 资源 / 协议错误）
        run: python tests/test_notes_mcp.py

      - name: 模型摘要（校验 / 回落 / 严格模式）
        run: python tests/test_notes_digest_llm.py

      - name: 离线导出（自包含 / 转义 / 原子写）
        run: python tests/test_notes_export.py

      - name: 版本硬链接与保留策略
        run: python tests/test_kb_hardlink.py

      - name: API Key 与 OpenAPI
        run: python tests/test_auth_openapi.py

      - name: 判域前置、扩展后置
        run: python tests/test_retrieval_order.py

      - name: 生产防护单测
        run: python tests/test_guards.py

      - name: Redis 跨实例限流 / 幂等 / 成本
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python tests/test_redis_guards.py

      - name: 双实例服务共享 Redis
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python tests/test_server_redis.py

      - name: 知识库版本 / 审批 / 文档级回滚
        run: python tests/test_kb_versions.py

      - name: 知识库版本 API 集成
        run: python tests/test_kb_api_versions.py

      - name: embedding 接入与索引
        run: python tests/test_embeddings.py

      - name: embedding 检索链路
        run: python tests/test_pipeline_embedding.py

      - name: PDF 解析器单测
        run: python tests/test_pdf_text.py

      - name: 知识库接口冒烟
        run: python tests/test_kb_api.py

      - name: PDF 上传端到端
        run: python tests/test_pdf_upload.py

      - name: DOCX 上传 + 自动出题
        run: python tests/test_docx_upload.py

      - name: 页面 / API 冒烟（离线模式）
        run: python tests/test_server.py

      - name: 设置面板 / 存储统计 / 技能与更新
        run: |
          python tests/test_settings.py
          python tests/test_settings_ops.py
          python tests/test_storage.py
          python tests/test_skill.py
          python tests/test_update.py

      # 来源校验、注入隔离、引用支持度、备份恢复、桌面客户端接口
      - name: 安全与质量加固
        run: |
          python tests/test_security.py
          python tests/test_quality.py
          python tests/test_backup.py
          python tests/test_client_api.py

      - name: 构建发布包（应用 + 插件）
        if: matrix.python == '3.13'
        run: python tools/build_release.py

      - name: 上传发布包
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: jiyi-packages
          path: |
            dist/jiyi-app-*.zip
            dist/jiyi-plugin-*.zip
            dist/jiyi-skill-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  e2e:
    name: e2e · chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Chromium（仅测试期依赖）
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: 两页 E2E（加载 / 溢出 / 控制台 / 深色 / 减动效）
        run: node tests/e2e_pages.mjs

      - name: 笔记 E2E（分区切换 / 编辑 / 409 / 导出 / 存为笔记）
        run: node tests/e2e_notes.mjs

      - name: 设置 E2E（抽屉 / 五分区 / 存储切换与迁移 / 开关语义）
        run: node tests/e2e_settings.mjs

      - name: e2e · 布局与会话
        run: node tests/e2e_layout.mjs
