name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke · py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    env:
      PYTHONUTF8: "1"

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m compileall -q src tests tools

      - name: 可选向量依赖（NumPy + FAISS）
        run: python -m pip install "numpy==2.3.3" "faiss-cpu==1.12.0"

      - name: 关键词抽取 / 命中 / 零调用
        run: python tests/test_keywords.py

      - name: 关键词 HTTP 接口
        run: python tests/test_keyword_api.py

      - name: 生产防护单测
        run: python tests/test_guards.py

      - name: Redis 跨实例限流 / 幂等 / 成本
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python tests/test_redis_guards.py

      - name: 双实例服务共享 Redis
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python tests/test_server_redis.py

      - name: 知识库版本 / 审批 / 文档级回滚
        run: python tests/test_kb_versions.py

      - name: 知识库版本 API 集成
        run: python tests/test_kb_api_versions.py

      - name: embedding 接入与索引
        run: python tests/test_embeddings.py

      - name: embedding 检索链路
        run: python tests/test_pipeline_embedding.py

      - name: PDF 解析器单测
        run: python tests/test_pdf_text.py

      - name: 知识库接口冒烟
        run: python tests/test_kb_api.py

      - name: PDF 上传端到端
        run: python tests/test_pdf_upload.py

      - name: DOCX 上传 + 自动出题
        run: python tests/test_docx_upload.py

      - name: 页面 / API 冒烟（离线模式）
        run: python tests/test_server.py

      - name: 构建安装包
        if: matrix.python == '3.13'
        run: python tools/build_release.py

      - name: 上传安装包
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: doc-qa-assistant-package
          path: |
            dist/doc-qa-assistant-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
