<div class="setup-mask" id="setupMask" hidden></div>
<section class="setup-card" id="setupPanel" hidden role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <p class="setup-kicker">第一次打开</p>
  <h1 id="setupTitle">先给文档安个家</h1>
  <p class="setup-lead">这个应用不把内容放在浏览器里。你选一个目录，文档、会话、导出都写进它——
    都是普通文件，随时能改、能备份、能整个搬走。</p>
  <ul class="setup-points">
    <li><b>文档</b>是 Markdown，用任何编辑器都能打开改写。</li>
    <li><b>会话</b>一条一个 JSON 文件，换浏览器、换端口都还在。</li>
    <li><b>智能体</b>读的是同一个目录，人和它看到的是同一份。</li>
  </ul>
  <label class="setup-field" for="setupHome">存放位置</label>
  <div class="setup-path">
    <input id="setupHome" autocomplete="off" spellcheck="false" placeholder="D:\记忆文档">
    <button class="btn ghost sm" id="setupPick" type="button">选择…</button>
  </div>
  <p class="setup-hint" id="setupHint">目录不存在会自动创建，里面会分出 notes / threads / index 三个子目录。</p>
  <p class="setup-msg" id="setupMsg"></p>
  <div class="setup-foot">
    <button class="btn ghost sm" id="setupLater" type="button">稍后再说</button>
    <button class="btn sm" id="setupGo" type="button">建在这里</button>
  </div>
</section>
