<main class="pf-wrap">
  <div class="pf-head">
    <h1>文件</h1>
    <p class="pf-sub">你的笔记与附件都存在这里，问答页的「存为笔记」也落在同一处。</p>
    <div class="pf-actions">
      <input id="pfSearch" class="pf-search" type="search" placeholder="搜索标题 / 内容" aria-label="搜索笔记" autocomplete="off">
      <span class="pf-total" id="pfTotal"></span>
      <button class="btn ghost sm" id="pfNew" type="button">新建笔记</button>
      <button class="btn ghost sm" id="pfExportHtml" type="button">导出 HTML</button>
      <button class="btn sm" id="pfExport" type="button">导出 JSON</button>
    </div>
  </div>
  <div class="pf-grid">
    <div class="pf-list" id="pfList"></div>
    <div class="pf-detail" id="pfDetail"><p class="files-empty">从左侧选一份文件。</p></div>
  </div>
  <input type="file" id="pfAssetFile" hidden multiple
         accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.svg,.pdf,.txt,.md,.csv,.json,.log,.docx,.xlsx,.pptx,.zip">
</main>
