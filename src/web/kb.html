
<main class="wrap kb-wrap">
  <div class="kb-head">
    <div>
      <h1>知识库</h1>
      <p class="kb-sub">问答时检索的只读语料。</p>
    </div>
    <div class="actions">
      <button class="pill pill-btn" id="kbVersion" type="button"
              title="查看全部版本">—</button>
      <span class="pill" id="kbMeta">加载中…</span>
      <a class="btn ghost sm" href="/debug">检索调试</a>
      <button class="btn ghost sm" id="reload" type="button">重建全部索引</button>
    </div>
  </div>

  <div id="panelDocs">
  <div class="kb-layout">
    <div class="kb-side">
      <section class="card">
        <div class="side-title">上传文档</div>
        <div class="drop" id="drop">
          <div class="dic">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          </div>
          <b>拖拽或点击上传</b>
          <span>.md / .txt / .pdf / .docx / .xlsx / .csv / .tsv · 可多选<br>文本 ≤ 512 KB · PDF/Word/Excel ≤ 6 MB</span>
          <input type="file" id="kbFile" accept=".md,.txt,.pdf,.docx,.xlsx,.csv,.tsv" multiple hidden>
        </div>
        <div class="kb-status" id="kbMsg"></div>
      </section>

      <section class="card kb-seed" id="kbSeed" hidden>
        <div class="side-title">空库怎么起步</div>
        <button class="seed-card" type="button" data-tpl="policy">
          <b>制度办法</b><span>客户适当性、信息披露、销售适当性 3 份</span></button>
        <button class="seed-card" type="button" data-tpl="product">
          <b>产品要素</b><span>理财产品要素说明、大额存单与定期 2 份</span></button>
        <button class="seed-card" type="button" data-tpl="regulatory">
          <b>监管摘录</b><span>理财业务监督管理办法 1 份</span></button>
      </section>
    </div>

    <section class="card kb-list">
      <div class="approve" id="approvePanel" hidden>
        <div class="approve-head">
          <b>待审批变更</b><span class="pill warn" id="apprCount">0</span>
          <span class="sp"><button class="btn ghost sm" id="apprRefresh" type="button">刷新</button></span>
        </div>
        <div id="apprList"></div>
        <div class="appr-token" id="apprToken" hidden>
          <span>管理员令牌</span>
          <input id="adminToken" type="password" placeholder="配置 ADMIN_TOKEN 时需要" autocomplete="off">
          <button class="btn ghost sm" id="adminSave" type="button">保存</button>
        </div>
      </div>

      <div class="kb-toolbar">
        <div class="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="kbSearch" placeholder="搜索文档" autocomplete="off">
        </div>
        <div class="chips" id="kbFilters">
          <button type="button" class="on" data-type="all">全部</button>
          <button type="button" data-type="md">MD</button>
          <button type="button" data-type="pdf">PDF</button>
          <button type="button" data-type="docx">DOCX</button>
        </div>
        <select class="kb-sort" id="kbSort">
          <option value="name">按名称</option>
          <option value="chunks">按知识块</option>
          <option value="size">按大小</option>
          <option value="mtime">按更新时间</option>
        </select>
      </div>

      <p class="kb-pending" id="kbPending" hidden></p>

      <div class="kb-batch" id="kbBatch" hidden>
        <span id="kbBatchCount">已选 0 份</span>
        <button class="btn danger-ghost sm" id="kbBatchDel" type="button">删除选中</button>
        <button class="btn ghost sm" id="kbBatchClear" type="button">取消选择</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th class="sel"><input type="checkbox" id="kbAll" aria-label="全选"></th><th>文件</th><th class="num">知识块</th><th class="num">大小</th><th>更新时间</th><th style="text-align:right">操作</th></tr></thead>
          <tbody id="kbBody"></tbody>
        </table>
      </div>
      <div class="kb-foot"><span id="kbFoot"></span></div>
    </section>
  </div>

  </div>

  
  <div class="kb-mask" id="kbMask" hidden></div>
  <div class="kb-modal" id="kbModal" hidden>
    <div class="kb-modal-head"><b id="kbModalTitle">版本</b>
      <button id="kbModalClose" type="button" aria-label="关闭">×</button></div>
    <div class="kb-modal-body" id="kbModalBody"></div>
  </div>

  <div class="ck-mask" id="ckMask" hidden></div>
  <aside class="ck-drawer" id="ckDrawer" hidden role="dialog" aria-modal="true" tabindex="-1" aria-label="文档分段">
    <div class="ck-head">
      <div><b id="ckTitle">分段</b><div class="ck-sub" id="ckSub"></div></div>
      <button class="ck-close" id="ckClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="ck-list" id="ckList"></div>
    <div class="ck-foot">
      <input id="ckQ" type="search" placeholder="用这份文档试一个问题" autocomplete="off">
      <button class="btn sm" id="ckRun" type="button">检索</button>
    </div>
    <div class="ck-result" id="ckResult" hidden></div>
  </aside>
</main>
