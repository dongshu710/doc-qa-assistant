# Fluent Bit 采集示例：把多实例的审计日志汇聚到 Loki / Elasticsearch。
# 应用侧只需 LOG_SINK=both（或 stdout），stdout 每行一个 JSON，字段含
# event/service/instance/request_id/action/trace_id。

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/doc-qa/audit.jsonl
    Parser            json
    Tag               docqa.audit
    Refresh_Interval  5
    Skip_Long_Lines   On

# 容器部署时用 stdout 采集，替代 tail：
# [INPUT]
#     Name              forward
#     Port              24224

[FILTER]
    Name          record_modifier
    Match         docqa.*
    Record        cluster prod
    Record        app doc-qa

[OUTPUT]
    Name          loki
    Match         docqa.*
    Host          loki.internal
    Port          3100
    Labels        job=doc-qa,service=$service,instance=$instance
    Label_keys    $service,$instance
    Line_format   json

# Elasticsearch 版本（二选一）：
# [OUTPUT]
#     Name            es
#     Match           docqa.*
#     Host            es.internal
#     Port            9200
#     Index           doc-qa-audit
#     Type            _doc
#     Logstash_Format On
